[project]
name = "group-settlement"
version = "0.1.0"
description = "모임 경비 정산 서비스 (이중기입 원장, 최소 송금)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
