name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 저장 계층과 API 테스트는 실제 MySQL 8.0에서 돈다 (CHECK 제약, 복합 외래 키, 유니크 잠금).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: group_settlement_test
          MYSQL_USER: group_settlement_app
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # CI 전용 값. 실제 비밀 값과는 무관하다.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: group_settlement_app
      DB_PASSWORD: ci-password
      TEST_DB_NAME: group_settlement_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # GitHub Actions는 CI=true를 설정한다 -> hypothesis 시드 고정 (tests/conftest.py)
      - name: Test
        run: pytest -q

      # 마이그레이션이 테이블 정의(app/db/tables.py)와 일치하는지 (테스트가 head까지 올려 둔 DB로 비교)
      - name: Migration matches models
        env:
          DB_NAME: group_settlement_test
        run: alembic check

      # 배포와 같은 명령으로 서버를 띄워 데모 페이지와 API가 실제로 응답하는지 확인한다.
      - name: Smoke test (server starts)
        env:
          DB_NAME: group_settlement_test
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ | grep -q "모임 정산"
          curl -fsS http://127.0.0.1:8000/static/app.js > /dev/null
          curl -fsS -X POST http://127.0.0.1:8000/api/groups \
            -H "Content-Type: application/json" \
            -d '{"name": "smoke", "currency": "KRW"}' | grep -q invite_token
